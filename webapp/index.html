<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GoodBingo - Play Demo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--ink:#253247;--muted:#718096;--panel:#e7edf5;--line:#cbd5e1;--white:#fff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Arial,Helvetica,sans-serif;background:#e5ebf3;color:var(--ink);overflow:hidden}
#app{height:100dvh;display:flex;flex-direction:column;max-width:760px;margin:auto}
.topbar{display:grid;grid-template-columns:1.08fr 1fr 1fr 1.08fr;gap:9px;padding:16px 14px 12px;background:#e5ebf3;z-index:3}
.stat{height:80px;border-radius:23px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#344256;color:#fff;box-shadow:0 5px 0 rgba(24,39,58,.12),0 8px 14px rgba(30,41,59,.12);font-weight:800}
.stat small{font-size:12px;font-style:italic;color:#aebdd0;margin-bottom:4px}
.stat strong{font-size:22px;line-height:1.1}
.room{background:#ffcc18;color:#5a4300;align-items:flex-start;padding-left:17px}
.room small{color:#604b0b}
.room strong{font-size:19px}
.balance{background:#16a34a}
.balance small{color:#e2fbe9}
.balance strong{font-size:19px}
#boardWrap{flex:1;min-height:0;overflow-y:auto;margin:5px 26px 0;padding:18px 17px 22px;border:2px solid #aab8ca;border-radius:62px 62px 0 0;background:#dce4ee;box-shadow:inset 0 2px 6px rgba(35,50,71,.08)}
#grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:14px 12px}
.ticket{min-width:0;aspect-ratio:1/1;border:1px solid #d8e0e9;border-radius:15px;background:#fff;color:#202b3a;font-size:clamp(15px,3.5vw,25px);font-weight:800;box-shadow:0 2px 4px rgba(30,41,59,.12);padding:0}
.ticket.taken{background:#d4dde8;color:#a9b5c4;border:2px solid #c3cedb;box-shadow:none}
.ticket.selected{background:#ffca24;color:#263247;border:2px solid #e3a900}
#bottom{flex-shrink:0;background:#fff;padding:14px 9% 20px;display:grid;grid-template-columns:1fr 1fr;gap:22px;z-index:4;box-shadow:0 -5px 16px rgba(30,41,59,.06)}
.slot{height:140px;border:3px dashed #aab7c7;border-radius:24px;background:#f1f4f8;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#8290a3;font-weight:800;letter-spacing:1px;text-align:center;gap:12px}
.slot .plus{font-size:43px;line-height:35px;color:#bdc8d6}
.slot .slotname{font-size:12px}
.slot.filled{border-style:solid;border-color:#e5b523;background:#fff8df;color:#604b0b}
.slot.filled .plus{font-size:24px;line-height:24px;color:#bd8a00}
#confirm{grid-column:1/-1;border:0;border-radius:12px;padding:13px;background:#16a34a;color:#fff;font-size:16px;font-weight:800}
#confirm:disabled{display:none}
#message{grid-column:1/-1;text-align:center;min-height:18px;font-size:12px;color:#66758a}
#cards{background:#fff;padding:0 14px 16px;max-height:170px;overflow:auto}
.card{margin:8px 0;padding:10px;background:#f1f4f8;border-radius:12px}
.card h3{margin:0 0 7px;font-size:14px}
table{width:100%;border-collapse:collapse;text-align:center;font-size:12px}
td,th{border:1px solid #cbd5e1;padding:4px 2px}
@media(max-width:380px){.topbar{gap:6px;padding:12px 9px 9px}.stat{height:70px;border-radius:18px}.stat strong{font-size:18px}.room strong,.balance strong{font-size:16px}#boardWrap{margin-left:12px;margin-right:12px;padding:14px 10px}#grid{gap:9px 7px}.ticket{border-radius:11px}#bottom{padding-left:6%;padding-right:6%;gap:12px}.slot{height:120px}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="stat room"><small>ROOM</small><strong>VIP 💰💰</strong></div>
    <div class="stat"><small>SOLD</small><strong id="sold">0</strong></div>
    <div class="stat"><small>TIME</small><strong id="timer">30s</strong></div>
    <div class="stat balance"><small>BALANCE</small><strong>0.00 ETB</strong></div>
  </header>
  <main id="boardWrap"><div id="grid"></div></main>
  <section id="bottom">
    <div class="slot" id="slot1"><div class="plus">+</div><div class="slotname">SLOT 1 EMPTY</div></div>
    <div class="slot" id="slot2"><div class="plus">+</div><div class="slotname">SLOT 2 EMPTY</div></div>
    <button id="confirm" disabled>CONFIRM CARTELA</button>
    <div id="message"></div>
  </section>
  <div id="cards"></div>
</div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const grid=document.getElementById('grid'),sold=document.getElementById('sold'),timer=document.getElementById('timer');
const confirmBtn=document.getElementById('confirm'),message=document.getElementById('message'),cardsBox=document.getElementById('cards');
const selected=new Set();let claimed=new Set();const headers={Authorization:'tma '+(tg?.initData||'')};
let seconds=30;
function updateSlots(){
  [1,2].forEach((i)=>{const el=document.getElementById('slot'+i),n=[...selected][i-1];el.classList.toggle('filled',!!n);el.innerHTML=n?'<div class="plus">🎟 '+n+'</div><div class="slotname">CARTELA '+n+'</div>':'<div class="plus">+</div><div class="slotname">SLOT '+i+' EMPTY</div>';});
  confirmBtn.disabled=selected.size===0;
}
function render(){
  grid.innerHTML='';
  for(let n=1;n<=700;n++){
    const b=document.createElement('button');b.type='button';b.textContent=n;
    b.className='ticket'+(claimed.has(n)?' taken':'')+(selected.has(n)?' selected':'');
    b.disabled=claimed.has(n);
    b.onclick=()=>{if(selected.has(n))selected.delete(n);else if(selected.size<2)selected.add(n);else{message.textContent='Maximum two Cartelas.';return;}message.textContent='';render();};
    grid.appendChild(b);
  }
  sold.textContent=claimed.size;updateSlots();
}
async function load(){
  try{
    if(!tg?.initData)throw Error('Please open this page from the Telegram bot.');
    const r=await fetch('/api/tickets',{headers});if(!r.ok)throw Error(await r.text());
    const d=await r.json();claimed=new Set(d.claimed);d.mine.forEach(n=>selected.add(n));
    render();if(d.mine.length)message.textContent='Your Cartelas: '+d.mine.join(', ');
  }catch(e){message.textContent=e.message;}
}
function showCard(no,rows){
  const box=document.createElement('div');box.className='card';const h=document.createElement('h3');h.textContent='Cartela '+no;box.appendChild(h);
  const t=document.createElement('table'),head=document.createElement('tr');
  for(const x of ['B','I','N','G','O']){const th=document.createElement('th');th.textContent=x;head.appendChild(th);}t.appendChild(head);
  for(const row of rows){const tr=document.createElement('tr');for(const x of row){const td=document.createElement('td');td.textContent=x;tr.appendChild(td);}t.appendChild(tr);}box.appendChild(t);cardsBox.appendChild(box);
}
confirmBtn.onclick=async()=>{
  confirmBtn.disabled=true;message.textContent='Saving Cartela...';
  try{
    const r=await fetch('/api/select',{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({tickets:[...selected]})});
    if(!r.ok)throw Error(await r.text());const d=await r.json();cardsBox.innerHTML='';
    for(const [n,c] of Object.entries(d.tickets))showCard(n,c);
    message.textContent='✅ Cartela selection saved.';claimed=new Set([...claimed,...selected]);render();
  }catch(e){message.textContent=e.message;await load();}
};
setInterval(()=>{seconds=seconds>0?seconds-1:30;timer.textContent=seconds+'s';},1000);
load();
</script>
</body></html>

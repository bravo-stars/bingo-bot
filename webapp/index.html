<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bingo Cartela</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;padding:14px;background:var(--tg-theme-bg-color,#101820);color:var(--tg-theme-text-color,#fff);font-family:Arial}h2{font-size:21px;margin:4px 0 8px}p{font-size:14px;color:var(--tg-theme-hint-color,#aaa)}#top{position:sticky;top:0;background:var(--tg-theme-bg-color,#101820);padding:8px 0;z-index:2}#grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.ticket{border:0;border-radius:7px;aspect-ratio:1.1;background:#247454;color:white;font-weight:bold}.taken{background:#4c535b;color:#aeb4ba}.selected{background:#e0a52c;color:#17202a}button:disabled{opacity:1}#confirm{width:100%;padding:14px;margin:14px 0;background:#269b69;color:white;border:0;border-radius:9px;font-weight:bold;font-size:16px}#confirm:disabled{opacity:.4}#message{min-height:24px;font-size:14px}.card{margin:12px 0;padding:10px;background:var(--tg-theme-secondary-bg-color,#26313a);border-radius:10px}table{width:100%;border-collapse:collapse;text-align:center}td,th{border:1px solid #77818a;padding:7px 2px}
</style></head><body>
<h2>🎟 Choose your Cartela</h2><p>Select one or two Cartelas from 1–700. Grey numbers are already taken.</p>
<div id="top">Selected: <b id="count">0</b>/2</div><div id="grid"></div><button id="confirm" disabled>Confirm Cartela</button><div id="message"></div><div id="cards"></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const grid=document.getElementById('grid'),count=document.getElementById('count'),confirmBtn=document.getElementById('confirm'),message=document.getElementById('message'),cardsBox=document.getElementById('cards');
const selected=new Set();let claimed=new Set();const headers={Authorization:'tma '+(tg?.initData||'')};
function render(){grid.innerHTML='';for(let n=1;n<=700;n++){const b=document.createElement('button');b.textContent=n;b.className='ticket'+(claimed.has(n)?' taken':'')+(selected.has(n)?' selected':'');b.disabled=claimed.has(n);b.onclick=()=>{if(selected.has(n))selected.delete(n);else if(selected.size<2)selected.add(n);else{message.textContent='Maximum two Cartelas.';return;}message.textContent='';render();};grid.appendChild(b);}count.textContent=selected.size;confirmBtn.disabled=selected.size<1||selected.size>2;}
async function load(){try{if(!tg?.initData)throw Error('Please open this page from the Telegram bot.');const r=await fetch('/api/tickets',{headers});if(!r.ok)throw Error(await r.text());const d=await r.json();claimed=new Set(d.claimed);d.mine.forEach(n=>selected.add(n));render();if(d.mine.length)message.textContent='Your Cartela(s): '+d.mine.join(', ');}catch(e){message.textContent=e.message;}}
function showCard(no,rows){const box=document.createElement('div');box.className='card';const h=document.createElement('h3');h.textContent='Cartela '+no;box.appendChild(h);const t=document.createElement('table'),head=document.createElement('tr');for(const x of ['B','I','N','G','O']){const th=document.createElement('th');th.textContent=x;head.appendChild(th);}t.appendChild(head);for(const row of rows){const tr=document.createElement('tr');for(const x of row){const td=document.createElement('td');td.textContent=x;tr.appendChild(td);}t.appendChild(tr);}box.appendChild(t);cardsBox.appendChild(box);}
confirmBtn.onclick=async()=>{confirmBtn.disabled=true;message.textContent='Saving...';try{const r=await fetch('/api/select',{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({tickets:[...selected]})});if(!r.ok)throw Error(await r.text());const d=await r.json();cardsBox.innerHTML='';for(const [n,c] of Object.entries(d.tickets))showCard(n,c);message.textContent='✅ Cartela selection saved.';claimed=new Set([...claimed,...selected]);render();}catch(e){message.textContent=e.message;await load();}};
load();
</script></body></html>
